[package]
name = "mnemo-node"
version = "0.5.1"
edition = "2021"
rust-version = "1.75"
description = "Node.js bindings for the Mnemo encrypted agent-memory engine (experimental scaffold; not yet published to npm)"
license = "Apache-2.0"
# Not yet published. When the bindings are stable enough to ship the
# real distribution will go to npm via napi-build, not to crates.io;
# this prevents an accidental `cargo publish`.
publish = false

[lib]
name = "mnemo_node"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Core crate is published as `mnemo-engine`; its [lib] name stays `mnemo`,
# so source code still writes `use mnemo::...`.
mnemo = { package = "mnemo-engine", path = "../.." }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

# Mirrors the declaration in `../../Cargo.toml` — the ARMv8 hardware-AES
# cfgs are set via RUSTFLAGS across the whole workspace, so every crate
# that is compiled under `-D warnings` needs this declaration.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(aes_armv8)',
    'cfg(polyval_armv8)',
] }
