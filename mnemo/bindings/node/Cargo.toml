[package]
name = "mnemo-node"
version = "0.11.0"
edition = "2021"
# napi's build script emits `cargo::` lines, which need Rust 1.77. The
# engine's MSRV stays 1.75; this experimental binding isn't published.
rust-version = "1.77"
description = "Node.js bindings for the Mnemo encrypted agent-memory engine (experimental scaffold; not yet published to npm)"
license = "Apache-2.0"
# Not yet published. When the bindings are stable enough to ship the
# real distribution will go to npm via napi-build, not to crates.io;
# this prevents an accidental `cargo publish`.
publish = false

[lib]
name = "mnemo_node"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# NAME-1 (v0.7.0): the core crate's lib name became `mnemo_engine`
# (dropped the pre-NAME-1 `[lib] name = "mnemo"` override). Source
# code writes `use mnemo_engine::...`.
mnemo_engine = { package = "mnemo-engine", path = "../.." }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

# Mirrors the declaration in `../../Cargo.toml` — the ARMv8 hardware-AES
# cfgs are set via RUSTFLAGS across the whole workspace, so every crate
# that is compiled under `-D warnings` needs this declaration.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(aes_armv8)',
    'cfg(polyval_armv8)',
] }
