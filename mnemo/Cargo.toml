[package]
# Distribution name on crates.io is `mnemo-engine`. The bare `mnemo` name
# is held by an unrelated crate, and `mnemo-db` is held by a different
# (MCP-native, DuckDB-backed) agent-memory project — see the v0.3.2 entry
# in CHANGELOG.md for the full rationale. The library name becomes
# `mnemo_engine` (Cargo's default from the package name) starting in
# v0.7.0 per PR NAME-1; consumers write `use mnemo_engine::...`, or
# keep `use mnemo::...` via a dependency rename:
#     mnemo = { package = "mnemo-engine", version = "0.7" }
# The CLI binary name stays `mnemo`, so users still invoke `mnemo` on
# the command line after `cargo install mnemo-engine`.
name = "mnemo-engine"
version = "0.14.0"
edition = "2021"
rust-version = "1.92"
# `benches/corpus.rs` is a shared helper module pulled into real benches
# via `#[path = "corpus.rs"] mod corpus;`, not a bench target. Disable
# auto-discovery so cargo doesn't try to build it as its own bench
# executable; the `[[bench]]` entries below list every real target.
autobenches = false
description = "Encrypted, single-file, portable agent memory engine with multi-signal recall, sessions, snapshots, and an IVF+PQ index"
license = "Apache-2.0"
repository = "https://github.com/toarchkumar/mnemo"
homepage = "https://toarchkumar.github.io/mnemo/"
documentation = "https://docs.rs/mnemo-engine"
readme = "README.md"
# RB-003.4: the published crate carries the library, the CLI and the
# examples that build from it. The tests, the benches and their fixtures
# (encrypted .mnemo files that don't compress), the Swift and Kotlin
# package sources, and the examples that need the `dev-hooks` feature stay
# in the repository: the self dev-dependency that turns it on is stripped
# from the published manifest.
exclude = [
    "tests/",
    "benches/*",
    # The measurement examples share the benches' corpus generator.
    "!benches/corpus.rs",
    "fuzz/",
    "bindings/",
    "examples/gen_*",
    "examples/device_budget.rs",
    "examples/fmt9_proto.rs",
]
# crates.io shows 5 keywords; pick the ones most likely to match how
# people search for this. Each keyword must be ≤20 chars and lowercase.
keywords = ["database", "encryption", "vector", "ai", "memory"]
# Standard crates.io category slugs (https://crates.io/category_slugs).
categories = ["database", "cryptography", "command-line-utilities"]

# The core crate is the workspace root. The Node binding lives here as a
# workspace member but is NOT a default member: a plain `cargo build` /
# `cargo test` builds only the core (which needs no Node toolchain).
# Build the Node binding explicitly with `cargo build -p mnemo-node`.
#
# The published Python binding lives in the sibling `mnemo-python/` crate
# (a standalone workspace, not a member of this one); it's built and
# packaged via `maturin` from its own directory.
[workspace]
members = ["bindings/node", "bindings/uniffi"]
default-members = ["."]

# NAME-1 (2026-11-05 Planner DECISION): the library/import name is now
# `mnemo_engine` — Cargo's default from the `mnemo-engine` package name
# (dashes become underscores). The pre-NAME-1 `[lib] name = "mnemo"`
# override is gone because it collided with crates.io's standalone
# `mnemo` crate (a terminal knowledge vault) and with PyPI's
# `mnemo-db` / `mnemo` top-level `mnemo/` modules. The distribution
# name (`mnemo-engine` on both PyPI and crates.io) is unchanged.
# Downstream crates write `use mnemo_engine::X`, or keep `use mnemo::X`
# via a Cargo dep rename: `mnemo = { package = "mnemo-engine" }`.
[lib]
path = "src/lib.rs"

# The CLI binary name stays `mnemo` — the executable users type at the
# shell is unchanged.
[[bin]]
name = "mnemo"
path = "src/bin/mnemo.rs"

[dependencies]
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
serde = { version = "=1.0.210", features = ["derive"] }
# `raw_value` (12.3 step 3): `mcp install` keeps other servers' entries in a
# client config byte for byte. No new crate.
serde_json = { version = "=1.0.128", features = ["raw_value"] }
rmp-serde = "=1.3.0"
# Pin the transitive `rmp` crate. It was pinned because 0.8.15+ is edition
# 2024, which the old MSRV (1.75) couldn't parse; since step 5a (MSRV 1.92)
# that reason is gone, and the pin stays because `rmp` encodes the file's
# records (lifting it is its own change, with the format tests).
rmp = "=0.8.14"
# Pulled in by `argon2`; pinned when 1.7+ (edition 2024) was above the old
# MSRV. It feeds the key derivation, so lifting it is its own change.
base64ct = "=1.6.0"
ulid = { version = "=1.1.3", features = ["serde"] }
thiserror = "=1.0.64"
zeroize = "=1.8.1"
# Pinned `=0.8.6` (patch bump from 0.8.5) to close RUSTSEC-2026-0097,
# an unsoundness that only triggers under a very narrow config —
# custom `log::Log` impl reentrantly calling `rand::rng()` on
# `ThreadRng` mid-reseed — which mnemo does not do. The engine
# never touches `log`, and no CLI code paths reach `ThreadRng` from
# a logger. Upgrading anyway is the least-surprising thing to do
# and satisfies the `advisories` check without an ignore.
rand = "=0.8.6"
clap = { version = "=4.4.18", features = ["derive"] }
# Used by the `mnemo` CLI binary only — `passphrase()` calls it when stdin
# is a TTY to read the passphrase without echo. The library never touches
# it, but Cargo doesn't have first-class "binary-only" deps, so it's
# pulled in unconditionally. Small (~50 KB compiled) and zero runtime
# cost when unused.
rpassword = "=7.3.1"
# Cross-platform advisory file locking (flock on Unix, LockFileEx on Windows).
# Used by `Mnemo::create`/`open` (exclusive) and `open_read_only` (shared)
# to prevent two writers — or a writer + reader on Windows — from
# corrupting a `.mnemo` file. Pure Rust, MSRV 1.75 on default sync feature.
# See CHANGELOG's Phase 1.1 entry. If this fails to build on your
# toolchain, the fallback is `fd-lock`.
fs4 = { version = "=0.9.1", default-features = false, features = ["sync"] }
# The identity of an open file and of the file at a path, compared to tell
# whether the path still names the file a handle opened (`dev`/`ino` on
# Unix; the volume serial number and file index on Windows). Safe Rust over
# `winapi-util` on Windows, so it fits `#![forbid(unsafe_code)]`. Already in
# the lockfile through criterion's walkdir.
same-file = "=1.0.6"
# SHA-256 for the result-cache key hashing (Phase 10.1). Pure Rust,
# widely deployed, small. RustCrypto family, so it interops with the
# same digest traits `argon2` and `blake2` already pull in transitively.
sha2 = "=0.10.8"
# Phase 6 speed benchmarks. Lives under `[dependencies]` (not
# `[dev-dependencies]`) because cargo refuses `optional = true` on
# dev-deps, and we need the whole subtree out of the dep graph on
# MSRV: criterion pulls rayon / half / ciborium whose latest versions
# raised MSRV to 1.80+. The `benches` feature gates it in. The
# published crate carries criterion only as an optional feature,
# never resolved by default consumers.
criterion = { version = "=0.5.1", features = ["html_reports"], optional = true }
# Phase 12.1 MEM-1 open_rss example variant 4 (`#[global_allocator]`).
# Pure Rust microsoft/mimalloc binding; gated behind `mimalloc_bench`
# so default consumers of the crate don't carry the dep. Lives under
# `[dependencies]` for the same reason criterion does — `optional`
# fields are only honoured on top-level deps, and we need the example
# binary (built from this crate) to link against it when requested.
mimalloc = { version = "=0.1.43", default-features = false, optional = true }
# FMT-9d (Phase 2): UAX #29 word segmentation for the BM25 tokenizer
# (`text.rs`). Pure Rust, no dependencies; pinned so tokens, and so the
# on-disk index, don't shift under a minor update.
unicode-segmentation = "=1.12.0"
# FMT-9e: v9 thread-turn records are zstd-compressed before encryption
# (`store.rs`, `compress_turn_record`). Required, not optional, since
# every build must read those records. The engine's first C dependency
# (`zstd-sys`, built by `cc`); CI cross-builds it for iOS and Android.
# `cc`'s `parallel` feature pulls `jobserver` (held at 0.1.34 for the old
# MSRV until step 5a lifted it).
zstd = { version = "=0.13.4", default-features = false }
# FMT-9a prototype measurement (`examples/fmt9_proto.rs --part compress`):
# lz4_flex as the pure-Rust page-compression candidate, compared before
# the format was frozen. Only built with `--features fmt9_proto`.
lz4_flex = { version = "=0.11.6", default-features = false, features = ["std", "safe-encode", "safe-decode"], optional = true }
# 12.3 step 5 (the built-in embedder), added by step 5a (MSRV-2) for the
# lockfile check only: nothing uses it yet. `default-features = false`, so
# no image models and no native TLS: ONNX Runtime through `ort`, with its
# binaries and the models fetched over rustls. Behind `embed-fastembed`,
# off for the library.
fastembed = { version = "=7.7.0", default-features = false, features = ["onnx", "ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }

# 12.4 step 2a, the shared lock layer: safe wrappers for `openat`,
# `mkdir`, `O_NOFOLLOW`, `fstat`, `statfs`, `geteuid` and `kill(pid, 0)`, so
# the sidecar directory is checked and used without `unsafe`. Already in the
# tree through fs4 (same version); this adds the `process` feature.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=0.38.44", default-features = false, features = ["std", "fs", "process"] }

# 12.3 step 2: the OS keychain behind the `keychain` feature (off for the
# library; on for the release CLI binaries and wheels). Since step 5a
# (MSRV-2, Rust 1.92): the `keyring` 4 family, as `keyring-core` and one
# store crate per platform, which is what `keyring` 4 itself advises for an
# application that picks its stores (the `keyring` crate's own `v1` mode
# would pull the async zbus store on Linux). The stores name entries as
# `keyring` 3.6.3 did, so its entries keep working: the macOS user
# keychain's generic password (service, account); Windows Credential
# Manager's `{account}.{service}`, UTF-16; Secret Service items found by
# `service` and `username`, through libdbus built from source (`vendored`),
# so no system libdbus-1-dev is needed.
[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = { version = "=1.0.1", optional = true }
apple-native-keyring-store = { version = "=1.0.2", optional = true, features = ["keychain"] }
[target.'cfg(windows)'.dependencies]
keyring-core = { version = "=1.0.1", optional = true }
windows-native-keyring-store = { version = "=1.1.0", optional = true, default-features = false }
[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = { version = "=1.0.1", optional = true }
dbus-secret-service-keyring-store = { version = "=1.0.1", optional = true, features = ["crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "=3.10.1"
# Property-based testing (Phase 1.3). Pinned exactly; `=1.5.0`'s MSRV
# is Rust 1.65, well under our 1.92 floor. Kept as a dev-dep only —
# it does not appear in the shipped library dependency set.
proptest = "=1.5.0"
# HOOKS-1: the crate's own tests, benches and examples get the hidden test
# hooks and the `MNEMO_DEV_*` switches (`dev-hooks`). A dev-dependency's
# features apply only to those targets, so the library and the CLI that
# `cargo build` / `cargo install` and the release workflow make stay without
# them.
mnemo-engine = { path = ".", features = ["dev-hooks"] }

# Step 5a (MSRV-2): `keyring` 3.6.3, which the keychain used before the
# `keyring` 4 stores, for `tests/keychain_os.rs` only: one test binary
# writes an entry through it and reads it back through the new store, so
# macOS never asks a second binary for access. Never in a release build.
[target.'cfg(target_os = "macos")'.dev-dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
[target.'cfg(windows)'.dev-dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[[bench]]
name = "write"
harness = false
required-features = ["benches"]

[[bench]]
name = "recall"
harness = false
required-features = ["benches"]

[[bench]]
name = "open"
harness = false
required-features = ["benches"]

[[bench]]
name = "cache"
harness = false
required-features = ["benches"]

[[bench]]
name = "embed_overhead"
harness = false
required-features = ["benches"]

[[bench]]
name = "thread"
harness = false
required-features = ["benches"]

[features]
# When enabled, exposes crash-injection hooks used by the Phase 1.3
# proptest under `mnemo_engine::__failpoints::*`. Always enabled during
# `cargo test` via `#[cfg(test)]`; the feature is here so an external
# fault-injection consumer (or a future integration test in a sibling
# crate) can opt into the same hooks without touching this crate's
# tests. Not for production use — never enable in a release build.
failpoints = []
# HOOKS-1 (RB-001.29): the `#[doc(hidden)]` `__*` test hooks on `Mnemo`
# (three of which change the file) and the `MNEMO_DEV_ANN_MIN_FACTS` /
# `MNEMO_DEV_TURN_ZSTD` switches. Off by default, so release builds (the
# CLI, the wheels, the mobile libraries) carry neither; the crate's own
# tests, benches and examples turn it on through the dev-dependency below.
# Never enable it in a release build.
dev-hooks = []
# 12.3 step 2: the OS keychain as the key store (macOS Keychain, Windows
# Credential Manager, Secret Service on Linux). Off by default for the
# library; the release CLI binaries and wheels turn it on. See the
# `keyring-core` lines below.
keychain = ["dep:keyring-core", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store", "dep:dbus-secret-service-keyring-store"]
# Phase 6 speed benchmarks. Pulls criterion (and its rayon/half/
# ciborium subtree, which raised MSRV to 1.80+). Opt-in only — the
# maintainer runs `cargo bench --no-run --features benches` on the
# reference machine; the stable rust CI job builds them via clippy
# `--all-targets --features failpoints,benches`; the MSRV CI job
# never sees them. Not for production use.
benches = ["dep:criterion"]
# 12.3 step 5: the built-in embedder (`fastembed`, ONNX). Nothing uses it
# yet (step 5a only checks the lockfile with it); off for the library.
embed-fastembed = ["dep:fastembed"]
# Phase 12.1 MEM-1 open_rss example variant 4: swap the global
# allocator for mimalloc inside the example binary only. Default
# consumers do not carry the dep. Combine with `--features benches`
# to actually build the example.
mimalloc_bench = ["dep:mimalloc"]
# FMT-9a: the compression comparison in examples/fmt9_proto.rs.
fmt9_proto = ["dep:lz4_flex"]

[profile.release]
lto = true
codegen-units = 1

# `aes` 0.8.4 and `polyval` 0.6.2 enable their ARMv8 hardware paths via
# `--cfg aes_armv8` / `--cfg polyval_armv8` (set by `.cargo/config.toml`
# at the repo root and by `RUSTFLAGS` in CI + release workflows). rustc
# doesn't know those cfg names on its own, so without this declaration
# `-D warnings` would trip on `unexpected_cfgs` and break every build.
# Needs Rust 1.74+ for `check-cfg`; our MSRV is 1.92.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(aes_armv8)',
    'cfg(polyval_armv8)',
] }
