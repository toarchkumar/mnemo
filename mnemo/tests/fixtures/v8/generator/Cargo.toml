# The v8 fixtures' generator (v0.13 step 2, the v8 sunset). It builds the
# committed v8 files in `..` with the **published** v0.12.3 engine, the
# last release that writes v8, so the read tests (`tests/v8_fixture.rs`)
# check a real v8 file from the previous engine rather than one this build
# made.
#
#   cd mnemo/tests/fixtures/v8/generator && cargo run --locked
#   cargo run --locked -- pending-wal      # v8_pending_wal.mnemo only
#
# Not part of the mnemo workspace: its own `[workspace]` table keeps it out.
[package]
name = "mnemo-v8-fixture-generator"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# `failpoints` arms a write failure for the pending-WAL fixture; it does
# nothing unless armed.
mnemo-engine = { version = "=0.12.3", features = ["failpoints"] }
serde_json = "1"
ulid = "1"

[workspace]
