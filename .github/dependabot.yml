# Keeps the commit-pinned GitHub Actions current (SEC-2): Dependabot opens
# a PR that moves each `uses: owner/repo@<sha> # <ref>` to the newest
# commit of its ref, weekly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The ref of dtolnay/rust-toolchain *is* the toolchain it installs, so
    # `@1.75` and `@1.82` are the MSRV checks. Dependabot would move them
    # to the newest Rust (PR 16 tried `@1.120`) and quietly end those
    # checks. CI-DEPS-1.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
