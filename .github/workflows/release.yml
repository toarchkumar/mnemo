name: Release

on:
  push:
    tags:
      # Fire on any version tag (e.g. v0.2.0, v0.3.0-rc1). The CHANGELOG
      # entry for the version is the source of truth for what shipped;
      # this workflow just builds and attaches artifacts to the GitHub
      # Release that auto-creates from the tag.
      - "v*"
  # The dry run of the mobile release (MOBILE-1e): builds and checks the
  # Swift and Android packages, proves the mnemo-swift token can push, and
  # uploads a Maven Central deployment that's validated and then dropped.
  # It creates no GitHub Release and publishes nothing; the engine jobs
  # (crates.io, PyPI) don't run. Real releases come only from tags.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (the only mode a manual run has)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # Hardware AES + PMULL on ARM. `aes` 0.8.4 and `polyval` 0.6.2 only
  # emit the fast path when built with these two cfg flags; without
  # them, every aarch64 build (including the aarch64-apple-darwin and
  # aarch64-unknown-linux-gnu release binaries and wheels) runs the
  # constant-time software fallback at ~5x the cost per page. x86_64
  # ignores them. Mirrored in `.cargo/config.toml` for local builds
  # and in `ci.yml`; env `RUSTFLAGS` overrides the config file, so the
  # workflows have to carry the flags themselves. Declared under
  # `[lints.rust] unexpected_cfgs` in each crate's Cargo.toml so
  # unknown-cfg warnings don't trip `-D warnings` anywhere.
  RUSTFLAGS: --cfg aes_armv8 --cfg polyval_armv8

permissions:
  # softprops/action-gh-release needs write access to create the release
  # and upload assets.
  contents: write

jobs:
  # --- Create the GitHub Release once (idempotent on re-runs). Subsequent
  #     binary / wheel jobs attach to this release by tag name.
  create-release:
    name: Create GitHub Release
    # Tags only. Every engine job below needs this one, so a manual dry run
    # skips them all.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release (or no-op if it already exists)
        uses: softprops/action-gh-release@v2
        with:
          # Body left empty so GitHub's "Generate release notes" picks up
          # commit history since the previous tag. The CHANGELOG section
          # for this version is the canonical record; the maintainer can
          # paste it into the release body via the UI after the fact.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  # --- Build the `mnemo` CLI binary for each release platform and attach
  #     to the GitHub Release. Linux aarch64 cross-compiles via zigbuild
  #     from an ubuntu-latest runner so we don't pay for a separate
  #     arm runner.
  build-cli:
    name: cli (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            use_zig: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            use_zig: true
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            use_zig: false
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            use_zig: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            use_zig: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zigbuild (Linux aarch64 cross only)
        if: matrix.use_zig
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build release binary
        working-directory: mnemo
        run: |
          if [ "${{ matrix.use_zig }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Stage and rename artifact
        id: stage
        working-directory: mnemo
        run: |
          src="target/${{ matrix.target }}/release/mnemo${{ matrix.ext }}"
          tag="${GITHUB_REF#refs/tags/}"
          out="mnemo-${tag}-${{ matrix.target }}${{ matrix.ext }}"
          cp "$src" "$out"
          echo "asset=$out" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: mnemo/${{ steps.stage.outputs.asset }}

  # --- Build Python wheels for each platform via maturin-action and attach
  #     to the release. The `publish-pypi` job below optionally uploads
  #     these wheels + the sdist to PyPI when the `ENABLE_PYPI_PUBLISH`
  #     repo variable is set to `true`; it uses PyPI Trusted Publishing
  #     (OIDC), so no `PYPI_API_TOKEN` secret is needed anywhere.
  build-wheels:
    name: wheels (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: auto
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: auto
          - target: x86_64-apple-darwin
            os: macos-latest
            manylinux: "off"
          - target: aarch64-apple-darwin
            os: macos-latest
            manylinux: "off"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            manylinux: "off"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel via maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `auto` lets maturin pick the right manylinux baseline. On
          # macOS/Windows the field is ignored when set to "off".
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          working-directory: mnemo-python
          # Pass RUSTFLAGS into the maturin container explicitly. The
          # aarch64-unknown-linux-gnu wheel builds inside a manylinux
          # docker image; the job-level `env.RUSTFLAGS` may not cross
          # the container boundary cleanly, so we restate it here.
          # Must match the `env.RUSTFLAGS` at the top of this file.
          rustflags: --cfg aes_armv8 --cfg polyval_armv8

      - name: Attach wheels to release
        uses: softprops/action-gh-release@v2
        with:
          files: mnemo-python/dist/*

      - name: Upload wheel artifact for PyPI publish job
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: mnemo-python/dist/*

  # --- Build the Python source distribution (sdist) once. `pip install
  #     mnemo-engine` on a platform we don't ship a wheel for (e.g. a
  #     BSD or an aarch64 musl runner) falls back to compiling from the
  #     sdist, so PyPI wants exactly one .tar.gz alongside the wheels.
  #     Kept as its own single-runner job because sdist is
  #     platform-independent and there's no point in the matrix.
  build-sdist:
    name: sdist
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sdist via maturin
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: mnemo-python

      - name: Attach sdist to release
        uses: softprops/action-gh-release@v2
        with:
          files: mnemo-python/dist/*.tar.gz

      - name: Upload sdist artifact for PyPI publish job
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: mnemo-python/dist/*.tar.gz

  # --- Publish all wheels + sdist to PyPI via Trusted Publishing (OIDC).
  #
  # Switched to PyPI Trusted Publishing in PR 9 (Phase 1.4) — replaces
  # the deprecated `maturin publish/upload` path (PyO3/maturin#2334) and
  # removes the long-lived `PYPI_API_TOKEN` secret. GitHub short-lived
  # OIDC token is minted per run and traded with PyPI for a scoped
  # upload credential; nothing to rotate.
  #
  # One-time PyPI-side setup (already done for `mnemo-engine`; here for
  # future-worker context):
  #   1. Log in to https://pypi.org, open the project page.
  #   2. Publishing → Add a new pending / trusted publisher.
  #   3. Owner: `toarchkumar`. Repository: `mnemo`. Workflow filename:
  #      `release.yml`. Environment name: `pypi`.
  #   4. Save. First release after the swap validates the wiring.
  #
  # `environment: pypi` is required — it's what PyPI matches against
  # when it validates the OIDC claim. `id-token: write` is what lets
  # the runner mint the OIDC token. `contents: read` is the default
  # least-privilege setting for this job (the release itself is
  # already created + populated by prior jobs).
  publish-pypi:
    name: publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/p/mnemo-engine
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Pull every wheel-* artifact this run uploaded plus the
          # single sdist. All land in `dist/`; twine (via the action
          # below) uploads the directory in one shot.
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent on re-runs: skip files PyPI already has.
          skip-existing: true
          packages-dir: dist

  # --- Optional: publish the core Rust crate to crates.io. Gated on the
  #     `ENABLE_CRATES_PUBLISH` repo variable so first-time setup is opt-in
  #     and the workflow stays no-op until the maintainer wires up
  #     CRATES_IO_TOKEN. Depends on `build-cli`: if the CLI binary
  #     compiles on every release target, the library source we're about
  #     to publish also compiles — that's the strongest sanity check we
  #     can do before pushing to a registry that doesn't allow takebacks.
  #
  #     cargo publish will *fail* if the version already exists on
  #     crates.io. That's the intended behavior — failures are loud and
  #     leave the previous release intact. There is no `--skip-existing`
  #     equivalent for cargo.
  publish-crates:
    name: publish to crates.io
    needs: build-cli
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CRATES_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish core crate
        working-directory: mnemo
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # === The mobile packages (MOBILE-1e) ===================================
  #
  # They run after the engine jobs, on a tag. A mobile failure doesn't undo
  # crates.io or PyPI: fix it and re-run the failed jobs. On a manual run
  # (the dry run) the engine jobs are skipped and these run alone, in
  # dry-run mode.

  # --- The version and the mode, checked once.
  mobile-prepare:
    name: mobile (version check)
    needs: [publish-crates, publish-pypi]
    # After the engine jobs succeed or are skipped (a dry run, or a
    # registry switched off), never after one failed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Version and mode
        id: v
        run: |
          engine=$(sed -n 's/^version = "\(.*\)"/\1/p' mnemo/Cargo.toml | head -1)
          uniffi=$(sed -n 's/^version = "\(.*\)"/\1/p' mnemo/bindings/uniffi/Cargo.toml | head -1)
          kotlin=$(sed -n 's/^VERSION_NAME=//p' mnemo/bindings/kotlin/gradle.properties)
          echo "engine $engine, mnemo-uniffi $uniffi, mnemo-android $kotlin"
          if [ "$engine" != "$uniffi" ] || [ "$engine" != "$kotlin" ]; then
            echo "::error::the manifests disagree on the version"; exit 1
          fi
          if [ "${{ github.event_name }}" = push ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$engine" ]; then
              echo "::error::tag v$tag doesn't match the manifests ($engine)"; exit 1
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ inputs.dry_run }}" != true ]; then
              echo "::error::a manual run is a dry run; real releases come from a v* tag"; exit 1
            fi
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$engine" >> "$GITHUB_OUTPUT"

  # --- iOS: the XCFramework zip on the GitHub Release, then the
  #     toarchkumar/mnemo-swift mirror (Package.swift pointing at that zip
  #     with its checksum, the generated Swift and the Swift layer's
  #     sources), committed and tagged with the bare version for SwiftPM.
  release-swift:
    name: mobile (Swift package)
    needs: mobile-prepare
    if: ${{ !cancelled() && needs.mobile-prepare.result == 'success' }}
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.mobile-prepare.outputs.version }}
      DRY_RUN: ${{ needs.mobile-prepare.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin

      - name: Build the XCFramework and the Swift bindings
        working-directory: mnemo/bindings/swift
        run: |
          set -o pipefail
          xcodebuild -version
          scripts/build-xcframework.sh 2>&1 | tee build.log
          ZIP="MnemoFFI-$VERSION.xcframework.zip"
          mv build/MnemoFFI.xcframework.zip "build/$ZIP"
          CHECKSUM=$(swift package compute-checksum "build/$ZIP")
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          {
            echo "### Swift package $VERSION"
            echo "- \`$ZIP\`: $(stat -f %z "build/$ZIP") bytes, checksum \`$CHECKSUM\`"
            echo '```'
            sed -n '/==> sizes/,$p' build.log | tail -n +2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the mnemo-swift release tree
        working-directory: mnemo/bindings/swift
        run: |
          scripts/make-release-package.sh "$VERSION" \
            "https://github.com/${{ github.repository }}/releases/download/v$VERSION/$ZIP" \
            "$CHECKSUM" "$RUNNER_TEMP/mnemo-swift"
          cat "$RUNNER_TEMP/mnemo-swift/Package.swift"

      # The consumer resolves the release tree with the binary target
      # pointed at the local zip (after checking its checksum against the
      # one in Package.swift), builds on the simulator and runs a round trip.
      - name: SPM consumer on the iOS simulator
        working-directory: mnemo/bindings/swift
        run: scripts/check-release-package.sh "$RUNNER_TEMP/mnemo-swift" "build/$ZIP"

      - name: Attach the zip to the GitHub Release
        if: env.DRY_RUN == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: mnemo/bindings/swift/build/${{ env.ZIP }}

      - name: Upload the zip (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swift-package-dry-run
          path: |
            mnemo/bindings/swift/build/${{ env.ZIP }}
            ${{ runner.temp }}/mnemo-swift/

      # A dry run proves the token can push: a dry-run-<version> branch,
      # pushed and deleted. On an empty repository the first branch pushed
      # becomes the default branch, which GitHub won't delete, so there it
      # runs `git push --dry-run` instead: that authenticates against the
      # push endpoint and changes nothing. A tag pushes main and tags it.
      - name: Push to mnemo-swift
        env:
          TOKEN: ${{ secrets.MNEMO_SWIFT_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${TOKEN}@github.com/toarchkumar/mnemo-swift.git"
          WORK="$RUNNER_TEMP/mirror"
          git init -q "$WORK"
          cd "$WORK"
          git config user.name "mnemo release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$REMOTE" main >/dev/null 2>&1; then
            git fetch -q --depth 1 "$REMOTE" main
            git checkout -q -b main FETCH_HEAD
            EMPTY=false
          else
            git checkout -q -b main
            EMPTY=true
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/mnemo-swift/." .
          git add -A
          git commit -q -m "MNemo $VERSION (from ${{ github.repository }}@${GITHUB_SHA::12})"
          git log --stat -1 | head -20
          if [ "$DRY_RUN" = true ]; then
            BRANCH="dry-run-$VERSION"
            if [ "$EMPTY" = true ]; then
              echo "mnemo-swift is empty: git push --dry-run (no branch is created)"
              git push --dry-run "$REMOTE" "HEAD:refs/heads/$BRANCH"
            else
              git push -q "$REMOTE" "HEAD:refs/heads/$BRANCH"
              git ls-remote --exit-code --heads "$REMOTE" "$BRANCH"
              git push -q "$REMOTE" --delete "$BRANCH"
              ! git ls-remote --exit-code --heads "$REMOTE" "$BRANCH"
              echo "pushed and deleted $BRANCH"
            fi
          else
            if git ls-remote --exit-code --tags "$REMOTE" "$VERSION" >/dev/null 2>&1; then
              echo "::error::mnemo-swift already has tag $VERSION"; exit 1
            fi
            git tag -a "$VERSION" -m "MNemo $VERSION"
            git push -q "$REMOTE" main
            git push -q "$REMOTE" "refs/tags/$VERSION"
            echo "pushed main and tag $VERSION"
          fi

      # After a release: a consumer resolves the published package from
      # GitHub (the real url and checksum) and builds for the simulator.
      - name: Resolve the published package
        if: env.DRY_RUN == 'false'
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/published-consumer"
          mkdir -p "$D/Sources/Check"
          cat > "$D/Package.swift" <<SWIFT
          // swift-tools-version:6.0
          import PackageDescription
          let package = Package(
              name: "Check",
              platforms: [.iOS(.v15), .macOS(.v12)],
              dependencies: [.package(url: "https://github.com/toarchkumar/mnemo-swift", exact: "$VERSION")],
              targets: [.target(name: "Check", dependencies: [.product(name: "Mnemo", package: "mnemo-swift")])]
          )
          SWIFT
          echo 'import Mnemo
          public func check() -> Int { generateKey().count }' > "$D/Sources/Check/Check.swift"
          cd "$D"
          xcodebuild build -scheme Check -destination 'generic/platform=iOS Simulator' -quiet
          echo "resolved and built mnemo-swift $VERSION from GitHub"

  # --- Android: the AAR on Maven Central (published and released), and
  #     on the GitHub Release. The dry run uploads a USER_MANAGED
  #     deployment, waits for validation and drops it, then checks a
  #     Gradle consumer against the signed artifact in mavenLocal().
  release-android:
    name: mobile (Android library)
    needs: mobile-prepare
    if: ${{ !cancelled() && needs.mobile-prepare.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.mobile-prepare.outputs.version }}
      DRY_RUN: ${{ needs.mobile-prepare.outputs.dry_run }}
      CARGO_NDK_VERSION: 4.1.2
      # The Maven secrets, mapped to the plugin's properties.
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate the Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (caching; the committed wrapper runs Gradle 9.6.1)
        uses: gradle/actions/setup-gradle@v4

      - name: Install cargo-ndk
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Build the native libraries and the Kotlin bindings
        working-directory: mnemo/bindings/kotlin
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "READELF=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" >> "$GITHUB_ENV"
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-native.sh

      - name: 16 KB pages and the size gate
        working-directory: mnemo/bindings/kotlin
        run: python3 scripts/check-elf.py "$READELF" --max-bytes 5242880 generated/jniLibs/*/libmnemo_uniffi.so

      - name: The AAR, and a signed publishToMavenLocal
        working-directory: mnemo/bindings/kotlin
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease publishToMavenLocal
          M2="$HOME/.m2/repository/io/github/toarchkumar/mnemo-android/$VERSION"
          ls -l "$M2"
          for f in "$M2"/*.{aar,pom,module,jar}; do
            [ -f "$f.asc" ] || { echo "::error::no signature for $f"; exit 1; }
          done
          python3 scripts/check-package.py "$READELF"
          cp build/outputs/aar/mnemo-android-release.aar "build/mnemo-android-$VERSION.aar"

      - name: Gradle consumer from mavenLocal()
        working-directory: mnemo/bindings/kotlin
        run: |
          ./gradlew --no-daemon -p release-check test printMnemoArtifact \
            -PmnemoVersion="$VERSION" -Pjna.library.path="$PWD/generated/host"

      - name: Maven Central (dry run, validated then dropped)
        if: env.DRY_RUN == 'true'
        working-directory: mnemo/bindings/kotlin
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: scripts/central-dry-run.sh

      - name: Maven Central (publish and release)
        if: env.DRY_RUN == 'false'
        working-directory: mnemo/bindings/kotlin
        run: ./gradlew --no-daemon --stacktrace publishAndReleaseToMavenCentral

      - name: Attach the AAR to the GitHub Release
        if: env.DRY_RUN == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: mnemo/bindings/kotlin/build/mnemo-android-${{ env.VERSION }}.aar

      - name: Upload the AAR (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-library-dry-run
          path: mnemo/bindings/kotlin/build/mnemo-android-${{ env.VERSION }}.aar
