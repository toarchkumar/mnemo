name: Android emulator

# The Kotlin package's instrumented tests (MOBILE-1c) on Android emulators:
# the Android Keystore, the ON_STOP flush through the real process
# lifecycle, the default directory, and loading the native libraries on a
# 4 KB and a 16 KB page-size image. Nightly, on release tags, and by hand
# (Actions > Android emulator > Run workflow). The JVM host tests run on
# every PR in ci.yml's `kotlin` job.
on:
  schedule:
    - cron: "23 4 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
  # TEMPORARY (MOBILE-1c bring-up, until the first green run): removed
  # before merging, since a workflow must be on main to run by hand.
  pull_request:
    paths: ["mnemo/bindings/kotlin/**", ".github/workflows/android-emulator.yml"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings --cfg aes_armv8 --cfg polyval_armv8

jobs:
  instrumented:
    name: instrumented (API ${{ matrix.api }}, ${{ matrix.target }}, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: google_apis
            page: 4096
          - api: 35
            target: google_apis_ps16k
            page: 16384
    env:
      CARGO_NDK_VERSION: 4.1.2
      GRADLE_VERSION: 9.6.1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (x86_64 Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: android-emulator

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install cargo-ndk
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      # The emulators are x86_64, so only that ABI is built.
      - name: Build the native library and the Kotlin bindings
        working-directory: mnemo/bindings/kotlin
        env:
          MNEMO_ABIS: x86_64
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-native.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mnemo/bindings/kotlin
          script: |
            adb shell getconf PAGE_SIZE
            gradle --no-daemon --stacktrace connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.expectPageSize=${{ matrix.page }}

      - name: Test counts
        if: always()
        working-directory: mnemo/bindings/kotlin
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("### Instrumented tests (API ${{ matrix.api }}, ${{ matrix.target }}, page ${{ matrix.page }})")
          for path in sorted(glob.glob("build/outputs/androidTest-results/connected/**/TEST-*.xml", recursive=True)):
              s = ET.parse(path).getroot()
              print(f"- {s.get('name').split('.')[-1]}: {s.get('tests')} tests, "
                    f"{s.get('failures')} failures, {s.get('errors')} errors, {s.get('skipped')} skipped")
              for case in s.iter("testcase"):
                  status = "FAIL" if case.find("failure") is not None or case.find("error") is not None else "ok"
                  print(f"  - {case.get('name')}: {status}")
          PY

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tests-api${{ matrix.api }}-${{ matrix.target }}
          path: |
            mnemo/bindings/kotlin/build/reports/androidTests/
            mnemo/bindings/kotlin/build/outputs/androidTest-results/
          if-no-files-found: ignore
