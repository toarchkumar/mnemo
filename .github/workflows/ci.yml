name: CI

on:
  push:
    # `release/**` covers hotfix branches (e.g. `release/0.5.x`) cut
    # from an older tag when main holds unreleased behavior changes.
    # Added for PR SEC-1 → v0.5.2, which couldn't be cut from main
    # because main held unreleased ANN-1 changes. Keep for future
    # patch releases that follow the same pattern.
    # `release-*` is the integration branch of a release being prepared
    # (v0.12.2 on: one PR per step into `release-0.12.2`, then `main` is
    # fast-forwarded at the tag).
    branches: [main, "release/**", "release-*"]
    # Coordination-file-only pushes don't change code and shouldn't
    # burn a CI run (lane A v0.8.1 DISPATCH: coordination files sync
    # only before a release tag or on user request, but a one-off
    # commit still lands between tags). Everything else keeps running.
    paths-ignore:
      - PLAN.md
      - reviewer_notes.md
      # Docs-only changes (RB-001.7). A push or PR that touches only these
      # runs no CI; one that touches anything else runs all of it. `main`
      # has no required status checks, so nothing waits on a skipped run.
      - README.md
      - "**/README.md"
      - index.html
      - CHANGELOG.md
      - RELEASING.md
  pull_request:
    branches: [main, "release/**", "release-*"]
    paths-ignore:
      - PLAN.md
      - reviewer_notes.md
      # (the same list as for pushes)
      - README.md
      - "**/README.md"
      - index.html
      - CHANGELOG.md
      - RELEASING.md

# A newer push to a branch or PR cancels its older run (RB-001.7). Every run
# on `main` gets a group of its own, so `main` is never cancelled or queued
# behind another run. Tags don't run this workflow, and release.yml has no
# concurrency group.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Treat new clippy lints in future toolchain releases as warnings, not
  # build-breaking errors, so a CI run going red is always something we
  # actually changed. The job below still uses `-D warnings` to enforce
  # the existing lint surface; `RUSTFLAGS` only governs the build itself.
  #
  # `--cfg aes_armv8 --cfg polyval_armv8` enables ARMv8 hardware AES +
  # PMULL in the `aes` and `polyval` crates. No-op on x86_64 (both
  # crates auto-detect AES-NI / CLMUL at runtime), active on aarch64
  # runners (macos-latest, and any linux aarch64 we add later). An env
  # `RUSTFLAGS` fully overrides `rustflags` from `.cargo/config.toml`,
  # so the flags must appear here as well. The cfg names are declared
  # under `[lints.rust] unexpected_cfgs` in every crate's Cargo.toml
  # so `-D warnings` doesn't trip when they aren't recognised by rustc.
  RUSTFLAGS: -D warnings --cfg aes_armv8 --cfg polyval_armv8

# The mobile jobs (the phone cross-builds, msrv-uniffi, swift, kotlin) are in
# mobile-ci.yml (REL-1): on a PR they run only when it touches the mobile
# code or what the mobile builds depend on; on a push, always.
jobs:
  # --- Rust core: library + CLI + integration tests + clippy -----------
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every platform even if one fails, so we get a full picture
      # of which OSes broke when a change lands.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo/registry, ~/.cargo/git, and ./target keyed on the
      # Cargo.lock(s) in the listed workspaces. Saves the bulk of every
      # rebuild — first CI run is slow, subsequent runs are cache hits.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo

      # `--features failpoints` enables the Phase 1.3 crash-injection
      # hook the proptest state machine arms via `mnemo_engine::__failpoints`.
      # The hook is a zero-cost stub when the feature is off, but the
      # integration-test crate can't see the library's own `cfg(test)`,
      # so the feature is the only way to expose the arm helper across
      # the crate boundary.
      - name: cargo test
        working-directory: mnemo
        run: cargo test --features failpoints

      - name: cargo clippy
        working-directory: mnemo
        # `benches` feature pulls criterion (and its rayon / half /
        # ciborium subtree). Scoped off from MSRV CI since those raised
        # MSRV to 1.80+; built here on stable so the Phase 6 benches
        # are compile-checked and linted on every PR. Mirrors what
        # `cargo bench --no-run --features benches` would check.
        run: cargo clippy --all-targets --features failpoints,benches -- -D warnings

      # MOBILE-1a: the UniFFI binding crate (a non-default workspace member,
      # so the two steps above don't build it).
      - name: cargo test + clippy -p mnemo-uniffi
        working-directory: mnemo
        run: |
          cargo test -p mnemo-uniffi
          cargo clippy -p mnemo-uniffi --all-targets -- -D warnings

      # `cargo fmt --check` gate. Phase 1.4 wires this into CI so
      # rustfmt drift is caught at PR time instead of at release
      # (which is where PR 6 first noticed a repo-wide fmt gap).
      # Runs on every matrix OS: rustfmt's output is byte-identical
      # across platforms, so this is functionally a redundant check
      # on 2/3 runners — but making it a per-OS step avoids a
      # separate job just for this and keeps the CI DAG flat.
      - name: cargo fmt --check
        working-directory: mnemo
        run: cargo fmt --check

  # --- cargo-deny: advisories + licenses + duplicate-version bans.
  #     Reads `mnemo/deny.toml`. Prebuilt binary via taiki-e/install-action
  #     (same pattern PR 7.1 used for cargo-fuzz) — no source compile.
  #     Linux-only: license SPDX + advisory DB checks are platform-
  #     independent, and running on 3 OSes would just triple runtime.
  deny:
    name: cargo-deny (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        working-directory: mnemo
        # `--workspace`: every member (the engine, mnemo-node, mnemo-uniffi),
        # not only the root package.
        run: cargo deny --workspace check

      # HOOKS-1: the release builds (the CLI, mnemo-uniffi for the phones,
      # the Python wheel, mnemo-node) must resolve the engine without
      # `dev-hooks`. Only the crate's own tests, benches and examples turn
      # it on (a dev-dependency), so a normal-edge feature tree with it in
      # means a release build would carry the test hooks.
      - name: Release builds carry no test hooks (dev-hooks)
        working-directory: mnemo
        run: |
          set -euo pipefail
          check() {
            if cargo tree "$@" -e features --edges normal,build -i mnemo-engine | grep -q 'feature "dev-hooks"'; then
              echo "::error::dev-hooks is enabled in a release build ($*)"; exit 1
            fi
            echo "ok: $* builds mnemo-engine without dev-hooks"
          }
          check --package mnemo-engine
          check --package mnemo-uniffi
          check --package mnemo-node
          (cd ../mnemo-python && check)

  # --- MSRV check: ensure the codebase still builds against the floor
  #     declared in Cargo.toml (`rust-version = "1.75"`). Linux-only to
  #     keep job count down; toolchain drift across platforms is rare and
  #     would surface on the stable matrix above first.
  msrv:
    name: msrv (rust 1.75, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: msrv-1.75

      - name: cargo build
        working-directory: mnemo
        # `--features failpoints` matches the test step below. We build
        # lib / bin / tests explicitly instead of `--all-targets` so
        # the Phase 6 criterion benches aren't part of this check:
        # criterion pulls `half v2.7.x` transitively, which raised its
        # MSRV to 1.81. Benches aren't part of the shipped crate, so
        # their MSRV is pinned by whatever `rustc` the maintainer uses
        # to run them, not by this gate.
        run: cargo build --lib --bins --tests --features failpoints

      - name: cargo test (lib + integration only)
        working-directory: mnemo
        # Skip --all-targets so we don't have to compile every test on
        # MSRV; the integration tests are the real correctness check.
        # `--features failpoints` needed for the proptest state machine
        # (Phase 1.3) to see the crash-injection hook.
        run: cargo test --features failpoints --test integration --test cli_smoke --test proptest_store

  # --- Python bindings: build via maturin + run mnemo-python test_mnemo
  python:
    name: python bindings (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo-python

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install maturin
        run: pip install maturin

      # `maturin develop` would be more direct, but it requires an active
      # virtualenv to install into; `actions/setup-python` gives us a
      # system Python on PATH without a venv. Build the abi3 wheel and
      # `pip install` it instead — this matches the recipe maturin's own
      # error message recommends for CI environments.
      - name: Build wheel
        working-directory: mnemo-python
        run: maturin build --release --out target/wheels

      - name: Install wheel
        working-directory: mnemo-python
        run: pip install target/wheels/*.whl

      - name: Run Python tests
        working-directory: mnemo-python
        run: python test_mnemo.py

  # --- Format compatibility (FMT-9f): a v8 file built by the published
  #     v0.10.0 CLI opens and writes under this build, compacts to v9 and
  #     recalls the same; v0.10.0 refuses the v9 copy. See
  #     `mnemo/tests/v0_10_fixture.rs`.
  compat:
    name: compat (v0.10.0 fixture, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: compat

      - name: Install the v0.10.0 CLI
        # Its own published lockfile; the workflow's `-D warnings` would
        # fail an old release on lints added by a newer rustc.
        env:
          RUSTFLAGS: ""
        run: cargo install mnemo-engine --version =0.10.0 --locked --root "$RUNNER_TEMP/v0_10"

      - name: cargo test --test v0_10_fixture
        working-directory: mnemo
        run: MNEMO_V0_10_BIN="$RUNNER_TEMP/v0_10/bin/mnemo" cargo test --test v0_10_fixture -- --nocapture

  # --- Fuzz smoke: 60s/target on every PR to catch regressions early.
  #     cargo-fuzz needs nightly (`-Zbuild-std`-adjacent sanitizer bits).
  #     `continue-on-error: false` so a new panic fails the build; the
  #     weekly job (fuzz-weekly.yml) runs longer for corpus growth.
  fuzz-smoke:
    name: fuzz-smoke (nightly, linux)
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_header
          - fuzz_wal_replay
          - fuzz_record_decode
          - fuzz_cache_directory
          - fuzz_mcp_frame
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mnemo
            mnemo/fuzz
          key: fuzz-smoke-${{ matrix.target }}

      # Prebuilt binary via taiki-e/install-action — avoids compiling
      # cargo-fuzz + rustix from source on nightly, which breaks whenever
      # rustix's use of internal `rustc_*` attributes drifts past what
      # nightly still exports (see PR 7 CI run #21).
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Force the gnu target — newer cargo-fuzz defaults to musl on
      # Linux, which (a) isn't installed in nightly by default and (b)
      # statically links libc, breaking AddressSanitizer.
      - name: Smoke ${{ matrix.target }} (60s)
        working-directory: mnemo
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60
