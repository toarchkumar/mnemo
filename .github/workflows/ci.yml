name: CI

on:
  push:
    # `release/**` covers hotfix branches (e.g. `release/0.5.x`) cut
    # from an older tag when main holds unreleased behavior changes.
    # Added for PR SEC-1 → v0.5.2, which couldn't be cut from main
    # because main held unreleased ANN-1 changes. Keep for future
    # patch releases that follow the same pattern.
    # `release-*` is the integration branch of a release being prepared
    # (v0.12.2 on: one PR per step into `release-0.12.2`, then `main` is
    # fast-forwarded at the tag).
    branches: [main, "release/**", "release-*"]
    # Coordination-file-only pushes don't change code and shouldn't
    # burn a CI run (lane A v0.8.1 DISPATCH: coordination files sync
    # only before a release tag or on user request, but a one-off
    # commit still lands between tags). Everything else keeps running.
    paths-ignore:
      - PLAN.md
      - reviewer_notes.md
      # Docs-only changes (RB-001.7). A push or PR that touches only these
      # runs no CI; one that touches anything else runs all of it. `main`
      # has no required status checks, so nothing waits on a skipped run.
      - README.md
      - "**/README.md"
      - index.html
      - CHANGELOG.md
      - RELEASING.md
      # Design notes (12.2 step 0's sign-off): a note-only PR runs no CI.
      - "docs/**"
  pull_request:
    branches: [main, "release/**", "release-*"]
    paths-ignore:
      - PLAN.md
      - reviewer_notes.md
      # (the same list as for pushes)
      - README.md
      - "**/README.md"
      - index.html
      - CHANGELOG.md
      - RELEASING.md
      - "docs/**"

# A newer push to a branch or PR cancels its older run (RB-001.7). Every run
# on `main` gets a group of its own, so `main` is never cancelled or queued
# behind another run. Tags don't run this workflow, and release.yml has no
# concurrency group.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Treat new clippy lints in future toolchain releases as warnings, not
  # build-breaking errors, so a CI run going red is always something we
  # actually changed. The job below still uses `-D warnings` to enforce
  # the existing lint surface; `RUSTFLAGS` only governs the build itself.
  #
  # `--cfg aes_armv8 --cfg polyval_armv8` enables ARMv8 hardware AES +
  # PMULL in the `aes` and `polyval` crates. No-op on x86_64 (both
  # crates auto-detect AES-NI / CLMUL at runtime), active on aarch64
  # runners (macos-latest, and any linux aarch64 we add later). An env
  # `RUSTFLAGS` fully overrides `rustflags` from `.cargo/config.toml`,
  # so the flags must appear here as well. The cfg names are declared
  # under `[lints.rust] unexpected_cfgs` in every crate's Cargo.toml
  # so `-D warnings` doesn't trip when they aren't recognised by rustc.
  RUSTFLAGS: -D warnings --cfg aes_armv8 --cfg polyval_armv8

# The mobile jobs (the phone cross-builds, msrv-uniffi, swift, kotlin) are in
# mobile-ci.yml (REL-1): on a PR they run only when it touches the mobile
# code or what the mobile builds depend on; on a push, always.
jobs:
  # --- Rust core: library + CLI + integration tests + clippy -----------
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every platform even if one fails, so we get a full picture
      # of which OSes broke when a change lands.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo/registry, ~/.cargo/git, and ./target keyed on the
      # Cargo.lock(s) in the listed workspaces. Saves the bulk of every
      # rebuild — first CI run is slow, subsequent runs are cache hits.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo

      # `--features failpoints` enables the Phase 1.3 crash-injection
      # hook the proptest state machine arms via `mnemo_engine::__failpoints`.
      # The hook is a zero-cost stub when the feature is off, but the
      # integration-test crate can't see the library's own `cfg(test)`,
      # so the feature is the only way to expose the arm helper across
      # the crate boundary.
      - name: cargo test
        working-directory: mnemo
        run: cargo test --features failpoints

      # 12.3 step 2: the OS keychain (`keychain`). The round trip writes to
      # the runner's own keychain, so it runs only here
      # (`MNEMO_TEST_OS_KEYCHAIN`); Linux has no Secret Service on a session
      # bus, so there it checks the "no keychain" path. The chain's tests
      # run again with the feature on.
      - name: cargo test (the OS keychain)
        working-directory: mnemo
        env:
          MNEMO_TEST_OS_KEYCHAIN: "1"
        run: cargo test --features failpoints,keychain --test keychain_os --test cli_keys --test cli_keychain -- --nocapture

      # 12.3 step 5: the built-in embedder (`embed-candle`). Its own unit
      # tests (the identifier rule, the checked download against a local
      # server) and the CLI's offline paths run on every platform; the tests
      # that need the model skip here and run in `builtin embedder (linux)`.
      - name: cargo test (the built-in embedder, offline)
        working-directory: mnemo
        run: cargo test --features embed-candle --lib --test builtin_embedder --test builtin_cli --test query_keywords --test guide

      - name: cargo clippy
        working-directory: mnemo
        # `benches` feature pulls criterion (and its rayon / half /
        # ciborium subtree). Scoped off from MSRV CI since those raised
        # MSRV to 1.80+; built here on stable so the Phase 6 benches
        # are compile-checked and linted on every PR. Mirrors what
        # `cargo bench --no-run --features benches` would check.
        # 12.3 step 5: `embed-candle` too, so the built-in embedder and the
        # `candle_hard` example are linted.
        run: cargo clippy --all-targets --features failpoints,benches,keychain,embed-candle -- -D warnings

      # MOBILE-1a: the UniFFI binding crate (a non-default workspace member,
      # so the two steps above don't build it).
      - name: cargo test + clippy -p mnemo-uniffi
        working-directory: mnemo
        run: |
          cargo test -p mnemo-uniffi
          cargo clippy -p mnemo-uniffi --all-targets -- -D warnings

      # `cargo fmt --check` gate. Phase 1.4 wires this into CI so
      # rustfmt drift is caught at PR time instead of at release
      # (which is where PR 6 first noticed a repo-wide fmt gap).
      # Runs on every matrix OS: rustfmt's output is byte-identical
      # across platforms, so this is functionally a redundant check
      # on 2/3 runners — but making it a per-OS step avoids a
      # separate job just for this and keeps the CI DAG flat.
      - name: cargo fmt --check
        working-directory: mnemo
        run: cargo fmt --check

  # --- cargo-deny: advisories + licenses + duplicate-version bans.
  #     Reads `mnemo/deny.toml`. Prebuilt binary via taiki-e/install-action
  #     (same pattern PR 7.1 used for cargo-fuzz) — no source compile.
  #     Linux-only: license SPDX + advisory DB checks are platform-
  #     independent, and running on 3 OSes would just triple runtime.
  # --- 12.3 step 5: the built-in embedder with its model. `mnemo embedder
  #     install` fetches the pinned files from Hugging Face (91 MB, kept in
  #     the Actions cache by revision), then the tests that need the model
  #     run against them: the vectors against `transformers`' reference,
  #     identifier-aware recall, and every CLI path, `install` included
  #     (through a local server of the same files).
  builtin:
    name: builtin embedder (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: builtin

      - name: Cache the model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/mnemo-cache
          # The revision pinned in mnemo/src/builtin.rs.
          key: mnemo-model-arctic-xs-${{ hashFiles('mnemo/src/builtin.rs') }}

      - name: mnemo embedder install
        working-directory: mnemo
        env:
          MNEMO_CACHE_DIR: ${{ runner.temp }}/mnemo-cache
        run: |
          cargo run --release --locked --features embed-candle --bin mnemo -- embedder install
          cargo run --release --locked --features embed-candle --bin mnemo -- embedder status

      - name: cargo test (with the model)
        working-directory: mnemo
        env:
          MNEMO_CACHE_DIR: ${{ runner.temp }}/mnemo-cache
        run: |
          export MNEMO_TEST_MODEL_DIR="$(cargo run -q --release --locked --features embed-candle --bin mnemo -- embedder status | sed -n 's/^cache: *//p')"
          test -f "$MNEMO_TEST_MODEL_DIR/model.safetensors"
          # 12.2 step 2: `guide` runs the guide's blocks that need the model.
          cargo test --release --locked --features embed-candle --test builtin_embedder --test builtin_cli --test guide -- --nocapture

  # 12.2 step 6: the install scripts. shellcheck on install.sh (POSIX sh),
  # and PowerShell's own parser on install.ps1; both tools come with the
  # Ubuntu runner. tests/install_sh.rs runs install.sh itself, and the
  # release workflow's check-artifacts runs both on their targets.
  scripts:
    name: install scripts (shellcheck, PowerShell parse)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: shellcheck install.sh
        run: shellcheck --shell=sh install.sh
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Output ("line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            throw "install.ps1 doesn't parse"
          }
          Write-Output "install.ps1 parses"

  deny:
    name: cargo-deny (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        working-directory: mnemo
        # `--workspace`: every member (the engine, mnemo-node, mnemo-uniffi),
        # not only the root package.
        # 12.3: with the `keychain` feature, so its optional crates are checked,
        # and `embed-candle` (step 5), the built-in embedder's.
        run: cargo deny --workspace --features keychain,embed-candle check

      # HOOKS-1: the release builds (the CLI, mnemo-uniffi for the phones,
      # the Python wheel, mnemo-node) must resolve the engine without
      # `dev-hooks`. Only the crate's own tests, benches and examples turn
      # it on (a dev-dependency), so a normal-edge feature tree with it in
      # means a release build would carry the test hooks.
      - name: Release builds carry no test hooks (dev-hooks)
        working-directory: mnemo
        run: |
          set -euo pipefail
          check() {
            if cargo tree "$@" -e features --edges normal,build -i mnemo-engine | grep -q 'feature "dev-hooks"'; then
              echo "::error::dev-hooks is enabled in a release build ($*)"; exit 1
            fi
            echo "ok: $* builds mnemo-engine without dev-hooks"
          }
          check --package mnemo-engine
          check --package mnemo-uniffi
          check --package mnemo-node
          (cd ../mnemo-python && check)

  # --- MSRV check: ensure the codebase still builds against the floor
  #     declared in Cargo.toml (`rust-version = "1.94"`, since v0.15 step 5:
  #     candle-core's x86_64 code needs it; 1.92 from step 5a). It builds the
  #     built-in embedder (`embed-candle`) on x86_64, where 1.93 fails. Linux-only to
  #     keep job count down; toolchain drift across platforms is rare and
  #     would surface on the stable matrix above first.
  msrv:
    name: msrv (rust 1.94, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: msrv-1.94

      - name: cargo build
        working-directory: mnemo
        # `--features failpoints` matches the test step below. We build
        # lib / bin / tests explicitly instead of `--all-targets` so
        # the Phase 6 criterion benches aren't part of this check:
        # criterion pulls `half v2.7.x` transitively, which raised its
        # MSRV to 1.81. Benches aren't part of the shipped crate, so
        # their MSRV is pinned by whatever `rustc` the maintainer uses
        # to run them, not by this gate.
        # 12.3: `--locked --features keychain`, so the keychain stores and
        # the vendored libdbus are compiled at the MSRV; step 5 adds
        # `embed-candle`, the built-in embedder, as the release builds have it.
        run: cargo build --locked --lib --bins --tests --features failpoints,keychain,embed-candle

      - name: cargo test (lib + integration only)
        working-directory: mnemo
        # Skip --all-targets so we don't have to compile every test on
        # MSRV; the integration tests are the real correctness check.
        # `--features failpoints` needed for the proptest state machine
        # (Phase 1.3) to see the crash-injection hook.
        run: cargo test --features failpoints --test integration --test cli_smoke --test proptest_store

  # --- 12.4 (v0.14.0 step 2a): Windows at the MSRV. std::fs::rename can't
  #     replace an open file on Windows before Rust 1.85 (1.75 to 1.84 refuse
  #     with os error 5; probed 2026-11-13), so a build with such a compiler
  #     falls back to closing the old file first, and shared mode refuses to
  #     start. Since v0.15 the MSRV is 1.94, so no supported compiler takes
  #     that path: this job builds the keychain and runs the rename and lock
  #     tests at the MSRV, on the normal path.
  windows-msrv:
    name: windows-msrv (rust 1.94)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: windows-msrv-1.94

      - name: cargo test (the rename and lock tests at the MSRV)
        working-directory: mnemo
        shell: bash
        run: |
          rustc --version
          cargo test --locked -p mnemo-engine --features failpoints,keychain --test replaced_file --test shared_lock

  # --- Python bindings: build via maturin + run mnemo-python test_mnemo
  python:
    name: python bindings (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo-python

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install maturin
        run: pip install maturin

      # `maturin develop` would be more direct, but it requires an active
      # virtualenv to install into; `actions/setup-python` gives us a
      # system Python on PATH without a venv. Build the abi3 wheel and
      # `pip install` it instead — this matches the recipe maturin's own
      # error message recommends for CI environments.
      # HOOKS-1: the test wheel has `dev-hooks`, because test_mnemo.py sets
      # `MNEMO_DEV_ANN_MIN_FACTS=0` to build an index on small files. The
      # released wheels (release.yml) are built without it.
      - name: Build wheel
        working-directory: mnemo-python
        # 12.3 step 5: `embed-candle` too, as the released wheels have it.
        run: maturin build --release --features dev-hooks,embed-candle --out target/wheels

      - name: Install wheel
        working-directory: mnemo-python
        run: pip install target/wheels/*.whl

      - name: Run Python tests
        working-directory: mnemo-python
        run: python test_mnemo.py

  # --- Format compatibility (FMT-9f): a v8 file built by the published
  #     v0.10.0 CLI opens read-only under this build (the v8 sunset),
  #     compacts to v9 and recalls the same; v0.10.0 refuses the v9 copy. See
  #     `mnemo/tests/v0_10_fixture.rs`.
  compat:
    name: compat (v0.10.0 fixture, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: compat

      - name: Install the v0.10.0 CLI
        # Its own published lockfile; the workflow's `-D warnings` would
        # fail an old release on lints added by a newer rustc.
        env:
          RUSTFLAGS: ""
        run: cargo install mnemo-engine --version =0.10.0 --locked --root "$RUNNER_TEMP/v0_10"

      - name: cargo test --test v0_10_fixture
        working-directory: mnemo
        run: MNEMO_V0_10_BIN="$RUNNER_TEMP/v0_10/bin/mnemo" cargo test --test v0_10_fixture -- --nocapture

  # --- 12.4 shared mode against the released v0.13.2 compactor (v0.14.0
  #     step 3): its `mnemo compact` releases the lock before the rename, so
  #     shared writers must report every write it loses
  #     (`ReplacedDuringWrite`), never acknowledge one. See
  #     `the_0_13_2_compactor_never_loses_an_acknowledged_write` in
  #     `mnemo/tests/cross_process.rs`.
  old-compactor:
    name: old compactor (v0.13.2, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: old-compactor

      - name: Cache the v0.13.2 CLI
        id: v0_13_2
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/v0_13_2
          key: mnemo-cli-0.13.2-${{ runner.os }}

      - name: Install the v0.13.2 CLI
        if: steps.v0_13_2.outputs.cache-hit != 'true'
        # Its own published lockfile; see the compat job.
        env:
          RUSTFLAGS: ""
        run: cargo install mnemo-engine --version =0.13.2 --locked --root "$RUNNER_TEMP/v0_13_2"

      - name: cargo test (the old compactor case)
        working-directory: mnemo
        run: >-
          MNEMO_V0_13_2_BIN="$RUNNER_TEMP/v0_13_2/bin/mnemo"
          cargo test --features failpoints --test cross_process --
          the_0_13_2_compactor_never_loses_an_acknowledged_write --nocapture

      - name: cargo test (the Linux-only shared-mode cases, with their output)
        # The full-disk and inode-reuse cases also run in the rust job; this
        # shows what they found (whether a reused inode could be forced).
        working-directory: mnemo
        run: >-
          cargo test --features failpoints --test cross_process --
          a_real_full_disk_in_a_process_that_lives_on
          a_reused_inode_number_is_caught_by_the_seal --nocapture

  # TOK-1 (v0.15, 12.3 step 4): a tokenizer 2 file against the published
  # v0.14.0 CLI. It must open, recall, verify and take writes there (the
  # BM25 manifest byte stays 1); what v0.14.0 writes makes the index mixed,
  # and its compaction leaves tokenizer 1, which v0.15 then reports and heals.
  compat-v0-14-0:
    name: compat (v0.14.0, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: compat-v0-14-0

      - name: Cache the v0.14.0 CLI
        id: v0_14_0
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/v0_14_0
          key: mnemo-cli-0.14.0-${{ runner.os }}

      - name: Install the v0.14.0 CLI
        if: steps.v0_14_0.outputs.cache-hit != 'true'
        # Its own published lockfile; see the compat job.
        env:
          RUSTFLAGS: ""
        run: cargo install mnemo-engine --version =0.14.0 --locked --root "$RUNNER_TEMP/v0_14_0"

      - name: cargo test (TOK-1 against v0.14.0)
        working-directory: mnemo
        run: >-
          MNEMO_V0_14_0_BIN="$RUNNER_TEMP/v0_14_0/bin/mnemo"
          cargo test --features failpoints --test tok1_compat -- --nocapture

  # --- RB-013.1 (v0.17.0): mixed versions against the published v0.16.1.
  # Its `compact` writes every coordination row back tagged as a fact (it
  # doesn't know the kind); v0.17 must still find the tasks, claims and
  # messages, say they're tagged as facts, and re-tag them.
  compat-v0-16-1:
    name: compat (v0.16.1, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: compat-v0-16-1

      - name: Cache the v0.16.1 CLI
        id: v0_16_1
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/v0_16_1
          key: mnemo-cli-0.16.1-${{ runner.os }}

      - name: Install the v0.16.1 CLI
        if: steps.v0_16_1.outputs.cache-hit != 'true'
        # Its own published lockfile; see the compat job.
        env:
          RUSTFLAGS: ""
        run: cargo install mnemo-engine --version =0.16.1 --locked --root "$RUNNER_TEMP/v0_16_1"

      - name: cargo test (coordination records against v0.16.1)
        working-directory: mnemo
        run: >-
          MNEMO_V0_16_1_BIN="$RUNNER_TEMP/v0_16_1/bin/mnemo"
          cargo test --features failpoints --test v0_16_compat -- --nocapture

  # --- Mixed versions (RB-014, v0.18.0): v0.17 reads a finding as a fact,
  # but respects `private`. v0.18 writes a SECURITY finding private until
  # it's verified, so v0.17.2's `export --git`, `list` and recall must leave
  # an unverified one out.
  compat-v0-17-2:
    name: compat (v0.17.2, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: compat-v0-17-2

      - name: Cache the v0.17.2 CLI
        id: v0_17_2
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/v0_17_2
          key: mnemo-cli-0.17.2-${{ runner.os }}

      - name: Install the v0.17.2 CLI
        if: steps.v0_17_2.outputs.cache-hit != 'true'
        # Its own published lockfile; see the compat job.
        env:
          RUSTFLAGS: ""
        run: cargo install mnemo-engine --version =0.17.2 --locked --root "$RUNNER_TEMP/v0_17_2"

      - name: cargo test (security findings against v0.17.2)
        working-directory: mnemo
        run: >-
          MNEMO_V0_17_2_BIN="$RUNNER_TEMP/v0_17_2/bin/mnemo"
          cargo test --features failpoints --test v0_17_compat -- --nocapture

  # --- Fuzz smoke: 60s/target on every PR to catch regressions early.
  #     cargo-fuzz needs nightly (`-Zbuild-std`-adjacent sanitizer bits).
  #     `continue-on-error: false` so a new panic fails the build; the
  #     weekly job (fuzz-weekly.yml) runs longer for corpus growth.
  fuzz-smoke:
    name: fuzz-smoke (nightly, linux)
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_header
          - fuzz_wal_replay
          - fuzz_record_decode
          - fuzz_cache_directory
          - fuzz_mcp_frame
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mnemo
            mnemo/fuzz
          key: fuzz-smoke-${{ matrix.target }}

      # Prebuilt binary via taiki-e/install-action — avoids compiling
      # cargo-fuzz + rustix from source on nightly, which breaks whenever
      # rustix's use of internal `rustc_*` attributes drifts past what
      # nightly still exports (see PR 7 CI run #21).
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Force the gnu target — newer cargo-fuzz defaults to musl on
      # Linux, which (a) isn't installed in nightly by default and (b)
      # statically links libc, breaking AddressSanitizer.
      - name: Smoke ${{ matrix.target }} (60s)
        working-directory: mnemo
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60
