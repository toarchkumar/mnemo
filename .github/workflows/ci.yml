name: CI

on:
  push:
    # `release/**` covers hotfix branches (e.g. `release/0.5.x`) cut
    # from an older tag when main holds unreleased behavior changes.
    # Added for PR SEC-1 → v0.5.2, which couldn't be cut from main
    # because main held unreleased ANN-1 changes. Keep for future
    # patch releases that follow the same pattern.
    branches: [main, "release/**"]
    # Coordination-file-only pushes don't change code and shouldn't
    # burn a CI run (lane A v0.8.1 DISPATCH: coordination files sync
    # only before a release tag or on user request, but a one-off
    # commit still lands between tags). Everything else keeps running.
    paths-ignore: [PLAN.md, reviewer_notes.md]
  pull_request:
    branches: [main, "release/**"]
    paths-ignore: [PLAN.md, reviewer_notes.md]

env:
  CARGO_TERM_COLOR: always
  # Treat new clippy lints in future toolchain releases as warnings, not
  # build-breaking errors, so a CI run going red is always something we
  # actually changed. The job below still uses `-D warnings` to enforce
  # the existing lint surface; `RUSTFLAGS` only governs the build itself.
  #
  # `--cfg aes_armv8 --cfg polyval_armv8` enables ARMv8 hardware AES +
  # PMULL in the `aes` and `polyval` crates. No-op on x86_64 (both
  # crates auto-detect AES-NI / CLMUL at runtime), active on aarch64
  # runners (macos-latest, and any linux aarch64 we add later). An env
  # `RUSTFLAGS` fully overrides `rustflags` from `.cargo/config.toml`,
  # so the flags must appear here as well. The cfg names are declared
  # under `[lints.rust] unexpected_cfgs` in every crate's Cargo.toml
  # so `-D warnings` doesn't trip when they aren't recognised by rustc.
  RUSTFLAGS: -D warnings --cfg aes_armv8 --cfg polyval_armv8

jobs:
  # --- Rust core: library + CLI + integration tests + clippy -----------
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every platform even if one fails, so we get a full picture
      # of which OSes broke when a change lands.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo/registry, ~/.cargo/git, and ./target keyed on the
      # Cargo.lock(s) in the listed workspaces. Saves the bulk of every
      # rebuild — first CI run is slow, subsequent runs are cache hits.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo

      # `--features failpoints` enables the Phase 1.3 crash-injection
      # hook the proptest state machine arms via `mnemo_engine::__failpoints`.
      # The hook is a zero-cost stub when the feature is off, but the
      # integration-test crate can't see the library's own `cfg(test)`,
      # so the feature is the only way to expose the arm helper across
      # the crate boundary.
      - name: cargo test
        working-directory: mnemo
        run: cargo test --features failpoints

      - name: cargo clippy
        working-directory: mnemo
        # `benches` feature pulls criterion (and its rayon / half /
        # ciborium subtree). Scoped off from MSRV CI since those raised
        # MSRV to 1.80+; built here on stable so the Phase 6 benches
        # are compile-checked and linted on every PR. Mirrors what
        # `cargo bench --no-run --features benches` would check.
        run: cargo clippy --all-targets --features failpoints,benches -- -D warnings

      # MOBILE-1a: the UniFFI binding crate (a non-default workspace member,
      # so the two steps above don't build it).
      - name: cargo test + clippy -p mnemo-uniffi
        working-directory: mnemo
        run: |
          cargo test -p mnemo-uniffi
          cargo clippy -p mnemo-uniffi --all-targets -- -D warnings

      # `cargo fmt --check` gate. Phase 1.4 wires this into CI so
      # rustfmt drift is caught at PR time instead of at release
      # (which is where PR 6 first noticed a repo-wide fmt gap).
      # Runs on every matrix OS: rustfmt's output is byte-identical
      # across platforms, so this is functionally a redundant check
      # on 2/3 runners — but making it a per-OS step avoids a
      # separate job just for this and keeps the CI DAG flat.
      - name: cargo fmt --check
        working-directory: mnemo
        run: cargo fmt --check

  # --- cargo-deny: advisories + licenses + duplicate-version bans.
  #     Reads `mnemo/deny.toml`. Prebuilt binary via taiki-e/install-action
  #     (same pattern PR 7.1 used for cargo-fuzz) — no source compile.
  #     Linux-only: license SPDX + advisory DB checks are platform-
  #     independent, and running on 3 OSes would just triple runtime.
  deny:
    name: cargo-deny (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        working-directory: mnemo
        # `--workspace`: every member (the engine, mnemo-node, mnemo-uniffi),
        # not only the root package.
        run: cargo deny --workspace check

  # --- MSRV check: ensure the codebase still builds against the floor
  #     declared in Cargo.toml (`rust-version = "1.75"`). Linux-only to
  #     keep job count down; toolchain drift across platforms is rare and
  #     would surface on the stable matrix above first.
  msrv:
    name: msrv (rust 1.75, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.120

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: msrv-1.75

      - name: cargo build
        working-directory: mnemo
        # `--features failpoints` matches the test step below. We build
        # lib / bin / tests explicitly instead of `--all-targets` so
        # the Phase 6 criterion benches aren't part of this check:
        # criterion pulls `half v2.7.x` transitively, which raised its
        # MSRV to 1.81. Benches aren't part of the shipped crate, so
        # their MSRV is pinned by whatever `rustc` the maintainer uses
        # to run them, not by this gate.
        run: cargo build --lib --bins --tests --features failpoints

      - name: cargo test (lib + integration only)
        working-directory: mnemo
        # Skip --all-targets so we don't have to compile every test on
        # MSRV; the integration tests are the real correctness check.
        # `--features failpoints` needed for the proptest state machine
        # (Phase 1.3) to see the crash-injection hook.
        run: cargo test --features failpoints --test integration --test cli_smoke --test proptest_store

  # --- Python bindings: build via maturin + run mnemo-python test_mnemo
  python:
    name: python bindings (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo-python

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install maturin
        run: pip install maturin

      # `maturin develop` would be more direct, but it requires an active
      # virtualenv to install into; `actions/setup-python` gives us a
      # system Python on PATH without a venv. Build the abi3 wheel and
      # `pip install` it instead — this matches the recipe maturin's own
      # error message recommends for CI environments.
      - name: Build wheel
        working-directory: mnemo-python
        run: maturin build --release --out target/wheels

      - name: Install wheel
        working-directory: mnemo-python
        run: pip install target/wheels/*.whl

      - name: Run Python tests
        working-directory: mnemo-python
        run: python test_mnemo.py

  # --- Format compatibility (FMT-9f): a v8 file built by the published
  #     v0.10.0 CLI opens and writes under this build, compacts to v9 and
  #     recalls the same; v0.10.0 refuses the v9 copy. See
  #     `mnemo/tests/v0_10_fixture.rs`.
  compat:
    name: compat (v0.10.0 fixture, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: compat

      - name: Install the v0.10.0 CLI
        # Its own published lockfile; the workflow's `-D warnings` would
        # fail an old release on lints added by a newer rustc.
        env:
          RUSTFLAGS: ""
        run: cargo install mnemo-engine --version =0.10.0 --locked --root "$RUNNER_TEMP/v0_10"

      - name: cargo test --test v0_10_fixture
        working-directory: mnemo
        run: MNEMO_V0_10_BIN="$RUNNER_TEMP/v0_10/bin/mnemo" cargo test --test v0_10_fixture -- --nocapture

  # --- Mobile cross-builds (FMT-9e, PLANNER-A condition (ii)). zstd is
  #     the engine's first C dependency (`zstd-sys`, built by `cc`), so
  #     every change must still compile the library for the phone
  #     targets MOBILE-1 ships. Library only (no CLI binary), debug: this
  #     is a compile gate, not a size or speed check (size.yml covers
  #     size). Android points `cc` at the runner's NDK clang (API 24);
  #     iOS uses the runner's Xcode SDK, which `cc` finds via xcrun.
  mobile:
    name: mobile (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            os: macos-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
          # MOBILE-1a: the emulator ABI (x86_64) is shipped in the AAR too.
          - target: x86_64-linux-android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: ${{ matrix.target }}

      - name: Point cc at the NDK (Android)
        if: endsWith(matrix.target, '-linux-android')
        run: |
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          T="${{ matrix.target }}"
          U=$(echo "$T" | tr 'a-z-' 'A-Z_')
          echo "CC_${T//-/_}=$TC/${T}24-clang" >> "$GITHUB_ENV"
          echo "AR_${T//-/_}=$TC/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${U}_LINKER=$TC/${T}24-clang" >> "$GITHUB_ENV"
          echo "NDK_BIN=$TC" >> "$GITHUB_ENV"

      - name: cargo build --lib
        working-directory: mnemo
        run: cargo build --lib --target ${{ matrix.target }}

      # MOBILE-1a: the UniFFI binding, release (LTO), for the same target.
      - name: cargo build -p mnemo-uniffi (release)
        working-directory: mnemo
        run: cargo build -p mnemo-uniffi --lib --release --target ${{ matrix.target }}

      # Gate (MOBILE-1a §Q9): the stripped .so is at most 5 MB per ABI.
      # The ELF alignment is printed for 1c, which gates on it.
      - name: stripped size and ELF alignment (Android)
        if: endsWith(matrix.target, '-linux-android')
        working-directory: mnemo
        run: |
          SO="target/${{ matrix.target }}/release/libmnemo_uniffi.so"
          "$NDK_BIN/llvm-strip" -o stripped.so "$SO"
          BYTES=$(stat -c %s stripped.so)
          echo "libmnemo_uniffi.so (${{ matrix.target }}): $BYTES bytes stripped"
          echo "### libmnemo_uniffi.so (${{ matrix.target }}): $BYTES bytes stripped" >> "$GITHUB_STEP_SUMMARY"
          "$NDK_BIN/llvm-readelf" -Wl stripped.so | grep -E 'LOAD|RELRO|Type'
          test "$BYTES" -le 5242880

      - name: static library size (iOS, informational)
        if: matrix.target == 'aarch64-apple-ios'
        working-directory: mnemo
        run: |
          A="target/${{ matrix.target }}/release/libmnemo_uniffi.a"
          ls -l "$A"
          echo "### libmnemo_uniffi.a (${{ matrix.target }}): $(stat -f %z "$A") bytes (before app linking; 1d reports the App Thinning delta)" >> "$GITHUB_STEP_SUMMARY"

  # --- MOBILE-1a: the UniFFI binding crate on its own declared minimum Rust
  #     (`rust-version` in mnemo/bindings/uniffi/Cargo.toml). The engine's
  #     MSRV job (1.75) never builds it: it's a non-default workspace member.
  msrv-uniffi:
    name: msrv-uniffi (rust 1.82, linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.82
        uses: dtolnay/rust-toolchain@1.120

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: msrv-uniffi-1.82

      - name: cargo test -p mnemo-uniffi
        working-directory: mnemo
        run: cargo test -p mnemo-uniffi

  # --- The Swift package (MOBILE-1b): builds the XCFramework, runs
  #     `swift test` on macOS and `xcodebuild test` on an iOS simulator
  #     (the background-transition, race and Keychain tests run only there).
  swift:
    name: swift (macos-latest, iOS simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable (Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: swift

      - name: Build the XCFramework and the Swift bindings
        working-directory: mnemo/bindings/swift
        run: |
          set -o pipefail
          xcodebuild -version
          scripts/build-xcframework.sh 2>&1 | tee build.log
          {
            echo "### MnemoFFI.xcframework (bytes)"
            echo '```'
            sed -n '/==> sizes/,$p' build.log | tail -n +2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: swift test (macOS)
        working-directory: mnemo/bindings/swift
        run: swift test

      - name: xcodebuild test (iOS simulator, hosted by TestHost for the Keychain)
        working-directory: mnemo/bindings/swift/TestHost
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  for d in devices[runtime]:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()
          ')
          echo "simulator $UDID"
          xcodebuild test -project MnemoTestHost.xcodeproj -scheme MnemoHostTests -destination "id=$UDID" 2>&1 \
            | tee xcodebuild.log | grep -E "^(✔|✘|◇ Test run)|Test run with|error:" || true
          tail -5 xcodebuild.log
          grep -q "TEST SUCCEEDED" xcodebuild.log

      # The iOS sample app (MOBILE-1d), on the XCFramework built above: a
      # simulator build, signed ad hoc (project.yml), so it has its
      # entitlements (the Keychain, the App Group) as it would on a device.
      - name: Build the iOS sample (simulator)
        working-directory: examples/mobile/ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project MnemoSample.xcodeproj -scheme MnemoSample -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim 2>&1 \
            | tee sample.log | grep -E "error:|warning: .*MnemoSample|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sample.log

      # App Thinning needs a signed export, so this is the stripped binary
      # delta of SizeProbe (with MNemo) against SizeBaseline (without).
      - name: iOS size report
        working-directory: examples/mobile/ios
        run: scripts/size-report.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # --- The Kotlin package (MOBILE-1c): the Android .so files (cargo-ndk,
  #     16 KB pages), the generated bindings, the JVM host tests, the AAR,
  #     the 16 KB and size gates, and a publishToMavenLocal dry run with a
  #     POM check. The instrumented emulator tests are android-emulator.yml.
  kotlin:
    name: kotlin (linux, Android AAR)
    runs-on: ubuntu-latest
    env:
      CARGO_NDK_VERSION: 4.1.2
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnemo
          key: kotlin

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The committed wrappers: their jars must match Gradle's published
      # checksums, and they fetch Gradle 9.6.1 (distributionSha256Sum set).
      - name: Validate the Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      # Its own RUSTFLAGS: the workspace's `--cfg` flags and `-D warnings`
      # aren't meant for a tool's build.
      - name: Install cargo-ndk
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Build the native libraries and the Kotlin bindings
        working-directory: mnemo/bindings/kotlin
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "READELF=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-native.sh

      # Gates: every LOAD aligned to 16 KB, the RELRO rule, and each .so at
      # most 5 MB stripped (MOBILE-1 §Q3 and §Q9).
      - name: 16 KB pages and the size gate
        working-directory: mnemo/bindings/kotlin
        run: |
          set -o pipefail
          python3 scripts/check-elf.py "$READELF" --max-bytes 5242880 generated/jniLibs/*/libmnemo_uniffi.so | tee elf.log
          {
            echo "### libmnemo_uniffi.so: 16 KB pages and size (gate: 5242880 bytes)"
            echo '```'
            cat elf.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: JVM tests, the AAR, publishToMavenLocal
        working-directory: mnemo/bindings/kotlin
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease publishToMavenLocal

      - name: Test counts
        if: always()
        working-directory: mnemo/bindings/kotlin
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("### JVM host tests")
          for path in sorted(glob.glob("build/test-results/testDebugUnitTest/TEST-*.xml")):
              s = ET.parse(path).getroot()
              print(f"- {s.get('name').split('.')[-1]}: {s.get('tests')} tests, "
                    f"{s.get('failures')} failures, {s.get('errors')} errors, {s.get('skipped')} skipped")
          PY

      - name: POM, jars and the AAR size report
        working-directory: mnemo/bindings/kotlin
        run: python3 scripts/check-package.py "$READELF"

      # The Android sample app (MOBILE-1d), with the library as an included
      # build: its JVM tests, and a release APK minified by R8 with only the
      # library's consumer rules (the emulator workflow runs its self-test).
      - name: Build the Android sample (release, R8)
        working-directory: examples/mobile/android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: zipalign 16 KB and the APK size report
        working-directory: examples/mobile/android
        run: |
          set -o pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ZIPALIGN=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)zipalign
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tee zipalign.log | grep -E "\.so|Verification" || true
          grep -q "Verification successful" zipalign.log
          python3 scripts/apk-report.py "$APK"

      - name: Upload the AAR, the APK and the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mnemo-android
          path: |
            mnemo/bindings/kotlin/build/outputs/aar/
            mnemo/bindings/kotlin/build/reports/tests/
            examples/mobile/android/app/build/outputs/apk/release/
            examples/mobile/android/app/build/outputs/mapping/release/mapping.txt
            examples/mobile/android/app/build/reports/tests/
          if-no-files-found: ignore


  # --- Fuzz smoke: 60s/target on every PR to catch regressions early.
  #     cargo-fuzz needs nightly (`-Zbuild-std`-adjacent sanitizer bits).
  #     `continue-on-error: false` so a new panic fails the build; the
  #     weekly job (fuzz-weekly.yml) runs longer for corpus growth.
  fuzz-smoke:
    name: fuzz-smoke (nightly, linux)
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_header
          - fuzz_wal_replay
          - fuzz_record_decode
          - fuzz_cache_directory
          - fuzz_mcp_frame
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mnemo
            mnemo/fuzz
          key: fuzz-smoke-${{ matrix.target }}

      # Prebuilt binary via taiki-e/install-action — avoids compiling
      # cargo-fuzz + rustix from source on nightly, which breaks whenever
      # rustix's use of internal `rustc_*` attributes drifts past what
      # nightly still exports (see PR 7 CI run #21).
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Force the gnu target — newer cargo-fuzz defaults to musl on
      # Linux, which (a) isn't installed in nightly by default and (b)
      # statically links libc, breaking AddressSanitizer.
      - name: Smoke ${{ matrix.target }} (60s)
        working-directory: mnemo
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60
