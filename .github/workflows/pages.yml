name: pages

# decision.site-publish (site-1): GitHub Pages publishes a site assembled
# from main by .github/scripts/assemble-site.sh, not main's whole tree. The
# script takes exactly the decision's list, fails on a missing file, and
# checks that every published address (the install scripts, llms.txt,
# llms-full.txt, the plugin marketplace, the page's images) is in the site.
#
# Until the repository's Pages source is switched to GitHub Actions (the
# maintainer's setting), legacy Pages keeps serving main: this workflow then
# assembles and checks the site, says so in a notice, and deploys nothing,
# so it never turns main or a release red. A pull request that touches the
# site runs the same assembly and check, and never deploys.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - index.html
      - site/**
      - docs/img/**
      - install.sh
      - install.ps1
      - llms.txt
      - llms-full.txt
      - .claude-plugin/**
      - .github/scripts/assemble-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling one half
# done.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: assemble the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the site
        run: sh .github/scripts/assemble-site.sh _site

      - name: Check every published address is in it
        run: sh .github/scripts/assemble-site.sh --check _site

      - name: Does Pages publish from this workflow?
        id: mode
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build type: $t"
          if [ "$t" = workflow ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pages publishes the branch itself (build type $t), so this run deploys nothing. Switch Settings > Pages > Source to GitHub Actions, then run this workflow again."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # .claude-plugin/marketplace.json is a published address.
          include-hidden-files: true

  deploy:
    name: deploy
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
