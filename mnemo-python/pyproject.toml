[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
# Distribution name on PyPI is `mnemo-engine`. The bare `mnemo` name
# is held by an unrelated 2020-era notebook assistant, and `mnemo-db`
# is held by a different (MCP-native, DuckDB-backed) agent-memory
# project — see the v0.3.2 entry in CHANGELOG.md for the full
# rationale. Both of those install a top-level `mnemo` module, which
# would silently clobber ours; NAME-1 (v0.7.0) moves the import name
# from `mnemo` to `mnemo_engine` to end the collision. No deprecation
# alias ships — the wheel installs **only** `mnemo_engine`; users
# migrate with one edit (`import mnemo_engine as mnemo` keeps call
# sites unchanged). See the "Breaking: import name" section in
# CHANGELOG.md for the full migration.
name = "mnemo-engine"
version = "0.11.0"
description = "Encrypted, portable agent-memory engine — Python bindings"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/toarchkumar/mnemo"
Repository = "https://github.com/toarchkumar/mnemo"

[tool.maturin]
# NAME-1 (Option A): the wheel ships one package, the Rust extension
# `mnemo_engine` (from `[lib] name = "mnemo_engine"` in Cargo.toml).
# No pure-Python alias package — a `mnemo` sibling would reintroduce
# the clash with PyPI `mnemo-db` and old PyPI `mnemo` that NAME-1
# exists to end. The `mnemo-python/python/mnemo_engine/__init__.py`
# shim is kept purely so maturin's mixed layout has the required
# `<python-source>/<module-name>/` directory; its only job is to
# re-export everything from the compiled submodule.
module-name = "mnemo_engine"
python-source = "python"
features = ["pyo3/extension-module"]
