[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
# Distribution name on PyPI is `mnemo-engine`. The bare `mnemo` name
# is held by an unrelated 2020-era notebook assistant, and `mnemo-db`
# is held by a different (MCP-native, DuckDB-backed) agent-memory
# project — see the v0.3.2 entry in CHANGELOG.md for the full
# rationale. Both of those install a top-level `mnemo` module, which
# would silently clobber ours; NAME-1 (v0.7.0) moves the import name
# to `mnemo_engine` to end the collision. The old `import mnemo` is
# supported for the whole v0.7.x series via a pure-Python shim under
# `python/mnemo/__init__.py` that re-exports every public name from
# `mnemo_engine` and emits one `DeprecationWarning` on import; the
# shim is removed in v0.8.0. See the "Breaking: import name" section
# in CHANGELOG.md for the full migration.
name = "mnemo-engine"
version = "0.6.1"
description = "Encrypted, portable agent-memory engine — Python bindings"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/toarchkumar/mnemo"
Repository = "https://github.com/toarchkumar/mnemo"

[tool.maturin]
# NAME-1: mixed layout. The Rust extension (`[lib] name = "mnemo_engine"`
# in Cargo.toml) is the primary artifact; the pure-Python `mnemo/`
# package under `python/` ships alongside it in the same wheel and
# acts as a deprecated-import shim for v0.7.x. `module-name` pins
# the extension's import name; `python-source = "python"` tells
# maturin to pick up the pure-Python package root.
module-name = "mnemo_engine"
python-source = "python"
features = ["pyo3/extension-module"]
